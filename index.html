<body">
    <h1>El Pollo Locco</h1>
    <div id="fullscreen" class="fullscreen">
        <div id="fullscreenIcon" class="fullscreenIcon" onclick="fullscreen()"></div>
        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="startWallpaper" class="startWallpaper">
            <div id="startButton" class="startButton">Start</div>
        </div>
        <div id="endWinWallpaper" class="endWinWallpaper d_none"></div>
        <div id="endLoseWallpaper" class="endLoseWallpaper d_none"></div>
        <div id="touch-keys" class="touch-keys">
            <div id="keys-doing" class="keys-doing">
                <div class="touch-key key-jump" id="key-jump">J</div>
                <div class="touch-key key-throw" id="key-throw">T</div>
            </div>
            <div id="keys-moving" class="keys-moving">
                <div class="touch-key key-run-left" id="key-run-left">L</div>
                <div class="touch-key key-run-right" id="key-run-right">R</div>
            </div>
        </div>
    </div>
