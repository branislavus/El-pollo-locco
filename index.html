<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Locco</title>
    <link rel="icon" type="image/x-icon" href="./img/3_enemies_chicken/chicken_normal/1_walk/1_w.png">
    <link rel="stylesheet" href="./fonts/chewy-v18-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/mobile.css">
    <link rel="stylesheet" href="./css/burger-menu.css">

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chickensmall.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/bottles.class.js"></script>
    <script src="./models/coins.class.js"></script>
    <script src="./models/endboss-handle-eggs.js"></script>
    <script src="./models/endboss-animation-sequence.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/status-bar-health.class.js"></script>
    <script src="./models/status-bar-coins.class.js"></script>
    <script src="./models/status-bar-bottles.class.js"></script>
    <script src="./models/status-bar-endboss.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/collision-jump-kill.class.js"></script>
    <script src="./models/collision-manager.class.js"></script>
    <script src="./models/world-renderer.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/egg.class.js"></script>
    <script src="./models/audio.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/local-storage.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/start.js"></script>
    <script src="./js/game-over.js"></script>
    <script src="./js/burger-menu.js"></script>

</head>

<body>
    <div class="main-container">
        <div class="desktop-action-buttons">
            <div id="restartGameDesktop" class="restartGame burger-menu-button" onclick="restartGame()"></div>
            <div id="toggleAllSoundDesktop" class="toggleAllSoundEnabled burger-menu-button" onclick="toggleAllSound()"></div>
            <div id="fullscreenIconDesktop" class="fullscreenIcon burger-menu-button" onclick="fullscreen()"></div>
        </div>
        <div class="burger-menu" id="burger-menu">
            <div class="burger-menu-on-off">
                <div class="burger-menu-button-on burger-menu-button" id="burgerMenuOpen"></div>
                <div class="burger-menu-button-off burger-menu-button" id="burgerMenuClose"></div>
            </div>
            <div class="burger-menu-buttons">
                <div id="restartGame" class="restartGame burger-menu-button" onclick="restartGame()"></div>
                <div id="toggleAllSound" class="toggleAllSoundEnabled burger-menu-button" onclick="toggleAllSound()">
                </div>
                <div id="fullscreenIcon" class="fullscreenIcon burger-menu-button" onclick="fullscreen()"></div>
            </div>

        </div>
        <div class="sub-container">
            <h1 id="title" class="title">El Pollo Locco</h1>
            <div id="fullscreen" class="fullscreen">

                <canvas id="canvas" width="720" height="480"></canvas>
                <div id="startWallpaper" class="startWallpaper">
                    <button type="button" id="startButton" class="startButton mar-top-20">Start</button>
                    <div class="impressum-mobile" id="impressum-mobile">
                        <a class="impressum-text" href="./impressum.html" target="_blank"
                            rel="noopener noreferrer">impressum</a><br>
                        <a class="impressum-text" href="./legal-policy.html" target="_blank"
                            rel="noopener noreferrer">legal-policy</a>
                    </div>
                </div>
                <div id="endWinWallpaper" class="endWinWallpaper d_none"></div>
                <div id="endLoseWallpaper" class="endLoseWallpaper d_none"></div>
                <div id="touch-keys" class="touch-keys">
                    <div id="keys-doing" class="keys-doing">
                        <button type="button" class="touch-key key-jump" id="key-jump"><img class="ButtonImage"
                                src="./img/duotone-chevron-up-small-round-svgrepo-com.svg" alt="up"></button>
                        <button type="button" class="touch-key key-throw buttonBottle" id="key-throw"></button>
                    </div>
                    <div id="keys-moving" class="keys-moving">
                        <button type="button" class="touch-key key-run-left" id="key-run-left"><img class="ButtonImage"
                                src="./img/duotone-chevron-left-small-round-svgrepo-com.svg" alt="left"></button>
                        <button type="button" class="touch-key key-run-right" id="key-run-right"><img
                                src="./img/duotone-chevron-right-small-round-svgrepo-com.svg" class="ButtonImage"
                                alt="right"></button>
                    </div>
                </div>
            </div>
            <div id="action-keys-legend-section" class="action-keys-legend-section">
                <h2>action keys</h2>
                <div class="tables">
                    <table  class="tableButtonsLegend">

                        <tr>
                            <td class="legendButtonsName">left</td>
                            <td class="text-align-right">- left arrow</td>
                        </tr>
                        <tr>
                            <td class="legendButtonsName">right</td>
                            <td class="text-align-right">- right arrow</td>
                        </tr>
                        <tr>
                            <td class="legendButtonsName">jump</td>
                            <td class="text-align-right">- spacebar</td>
                        </tr>
                        <tr>
                            <td class="legendButtonsName">throw bottle</td>
                            <td class="text-align-right">- D</td>
                        </tr>
                    </table>

                    <table class="tableButtonsLegend">
                        <tr class="legendButtons">
                            <td class="legendButtonsName">press start to play</td>
                            <td class="legendButtonsTd">- <button type="button"
                                    class="startButton start-button-legend" disabled>Start</button>
                            </td>
                        </tr>
                        <tr class="legendButtons">
                            <td class="legendButtonsName">to restart game press <span style="color: red">Enter</span> or
                            </td>
                            <td class="legendButtonsTd">- <button type="button"
                                    class="restartGame legend-menu-button restartGameLegend" disabled></button></td>
                        </tr>
                         <tr class="legendButtons">
                            <td class="legendButtonsName">press to sound on/off</td>
                            <td class="legendButtonsTd">- <button type="button"
                                    class="toggleAllSoundEnabled legend-menu-button fullscreenIconLegend buttonHide" disabled></button>
                            </td>
                        </tr>
                         <tr class="legendButtons">
                            <td class="legendButtonsName">press to fullscreen</td>
                            <td class="legendButtonsTd">- <button type="button"
                                    class="fullscreenIcon legend-menu-button fullscreenIconLegend buttonHide" disabled></button>
                            </td>
                        </tr>

                    </table>
                </div>
            </div>

            <div id="warning" class="warning">
                <p class="p-warning">Turn your device<br>to landscape mode<br>to continue.</p>
            </div>

            <div class="impressum" id="impressum">
                <a class="impressum-text" href="./impressum.html" target="_blank"
                    rel="noopener noreferrer">impressum</a><br>
                <a class="impressum-text" href="./legal-policy.html" target="_blank"
                    rel="noopener noreferrer">legal-policy</a>
            </div>
        </div>
    </div>

    <script src="./js/overlay.js"></script>
    <script src="./js/checksound.js"></script>
</body>

</html>
